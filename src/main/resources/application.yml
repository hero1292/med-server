server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medschedule}
    username: ${DB_USER:meds}
    password: ${DB_PASSWORD:meds}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  issuer: medscheduler
  access-ttl: PT30M
  refresh-ttl: P14D
  secret: ${JWT_SECRET:change-me-to-a-long-random-string}

springdoc:
  swagger-ui:
    path: /swagger-ui
    operationsSorter: method
    tagsSorter: alpha
    displayRequestDuration: true
    tryItOutEnabled: true
  api-docs:
    path: /v3/api-docs

logging:
  charset:
    console: UTF-8
  level:
    root: INFO
    org.aleksanyan.medserver: DEBUG